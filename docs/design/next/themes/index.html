<!doctype html>
<html lang="zh-CN" data-theme="precision" data-appearance="light" data-appearance-pref="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流息 · 三套主题设计稿（K1）</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/design-bar.css">
  <script defer src="js/icons.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <!-- 设计稿自用的切换条（不属于界面）：主题 × 外观 × 画面 × 余量 -->
  <div class="design-bar" id="designBar" aria-label="设计稿切换条">
    <span class="db-title">设计稿 K1</span>
    <label>主题
      <select id="dbTheme">
        <option value="precision">精密国际主义（默认）</option>
        <option value="glass">澄明玻璃</option>
        <option value="research">研究对话</option>
      </select>
    </label>
    <label>外观
      <select id="dbAppearance">
        <option value="system">跟随系统（默认）</option>
        <option value="light">浅色</option>
        <option value="dark">深色</option>
      </select>
    </label>
    <label>画面
      <select id="dbScreen">
        <option value="shelf">1 库架</option>
        <option value="chat">2 和主 Agent 聊</option>
        <option value="inbox">3 库页 · 待看</option>
        <option value="library">4 库页 · 资料库</option>
        <option value="ask">5 库页 · 问库</option>
        <option value="settings">6 设置</option>
        <option value="queue">7 排队</option>
      </select>
    </label>
    <label>左下角余量
      <select id="dbQuota">
        <option value="claude">有数 · 连接你电脑上的 Claude Code</option>
        <option value="codex">有数 · 连接你电脑上的 Codex</option>
        <option value="api">有数 · API（厂商有余额接口）</option>
        <option value="unreadable">读不到</option>
        <option value="none">API 无余额接口（不显示）</option>
      </select>
    </label>
    <span class="db-now" id="dbNow"></span>
  </div>

  <div class="app" id="app">
    <nav class="sidebar" id="sidebar" aria-label="导航"></nav>
    <main class="workspace" id="main"></main>
    <aside class="context-panel" id="panel" aria-label="右栏"></aside>
  </div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
